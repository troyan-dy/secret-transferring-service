[flake8]
max-line-length = 120
# default flake8 checks plus wemake-python-styleguide
select = E, W, F, C90, WPS
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .mypy_cache,
    .pytest_cache
per-file-ignores =
    # WPS404: FastAPI dependency injection requires Depends() as an argument default
    secret_transferring_service/app.py: WPS404
    # WPS100: renaming the module would change the package import path
    secret_transferring_service/utils.py: WPS100
    # WPS444: placeholder test asserts a constant
    tests/test_app.py: WPS444
